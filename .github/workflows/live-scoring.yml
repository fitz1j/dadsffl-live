name: DadsFFL live scoring

# Publishes web/index.html (title/landing page), web/live.html (the page that
# reads live scores client-side from Supabase, via the fetch-and-score Edge
# Function + PostgREST) to GitHub Pages. All score-fetching now happens
# server-side on a Supabase pg_cron schedule, not here, so this workflow only
# needs to run when one of these pages itself changes. web/rosters.html is a
# static, owner-name-stripped draft roster page (team names only, no real
# person names) so this public repo stays free of league personal data per
# its README. web/matchups.html is a static preseason simulation page
# (team names only, same privacy rules). web/post-draft-rosters.html is the
# league's real 2026 rosters from the completed draft (team names only, no
# owner names). (Superseded the old GitHub
# Actions `schedule:`-triggered Python pipeline that rendered live.html itself
# every 5 minutes — see src/live_score.py, now unused for the live page.)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'web/index.html'
      - 'web/live.html'
      - 'web/rosters.html'
      - 'web/matchups.html'
      - 'web/post-draft-rosters.html'
      - '.github/workflows/live-scoring.yml'

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp web/live.html _site/live.html
          cp web/rosters.html _site/rosters.html
          cp web/matchups.html _site/matchups.html
          cp web/post-draft-rosters.html _site/post-draft-rosters.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
