name: DadsFFL live scoring

# Publishes web/index.html (title/landing page) and web/live.html (the page that
# reads live scores client-side from Supabase, via the fetch-and-score Edge
# Function + PostgREST) to GitHub Pages. All score-fetching now happens
# server-side on a Supabase pg_cron schedule, not here, so this workflow only
# needs to run when either page itself changes. (Superseded the old GitHub
# Actions `schedule:`-triggered Python pipeline that rendered live.html itself
# every 5 minutes — see src/live_score.py, now unused for the live page.)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'web/index.html'
      - 'web/live.html'
      - '.github/workflows/live-scoring.yml'

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp web/live.html _site/live.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
