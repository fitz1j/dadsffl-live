name: DadsFFL live scoring

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # UTC, best-effort. Every 5 min on Sun/Mon/Thu/Sat (typical NFL game days).
    - cron: '*/5 * * * 0,1,4,6'

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch + score live games
        run: |
          python3 src/live_score.py --live --refresh 120 --out _site/index.html
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
