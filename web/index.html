<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DadsFFL</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --text-muted:#898781; --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --home:#2a78d6; --away:#eb6834; --good:#0ca30c; --muted-fill:#e1e0d9;
    --shadow:0 1px 2px rgba(11,11,11,0.06),0 1px 8px rgba(11,11,11,0.04);
  }
  @media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --surface-1:#1a1a19; --page:#0d0d0d; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
    --home:#3987e5; --away:#d95926; --good:#0ca30c; --muted-fill:#2c2c2a;
    --shadow:0 1px 2px rgba(0,0,0,0.4),0 1px 10px rgba(0,0,0,0.35);
  }}
  :root[data-theme="dark"]{
    color-scheme:dark;
    --surface-1:#1a1a19; --page:#0d0d0d; --text-primary:#fff; --text-secondary:#c3c2b7;
    --text-muted:#898781; --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
    --home:#3987e5; --away:#d95926; --good:#0ca30c; --muted-fill:#2c2c2a;
    --shadow:0 1px 2px rgba(0,0,0,0.4),0 1px 10px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--page);color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4;}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px 56px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .brand{font-size:20px;font-weight:700;letter-spacing:-0.01em;}
  .brand .sub{color:var(--text-muted);font-weight:500;font-size:13px;margin-left:8px;}
  .theme-toggle{border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);
    border-radius:999px;font-size:12px;padding:5px 12px;cursor:pointer;font-family:inherit;}
  .theme-toggle:hover{color:var(--text-primary);}
  .theme-toggle[aria-pressed="true"]{color:var(--text-primary);border-color:var(--text-muted);}

  .hero{display:block;background:var(--surface-1);border:1px solid var(--border);border-radius:14px;
    box-shadow:var(--shadow);padding:18px 18px;text-decoration:none;color:inherit;margin:18px 0 26px;
    transition:border-color .15s;}
  .hero:hover{border-color:var(--text-muted);}
  .hero .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .hero .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:8px;vertical-align:middle;}
  .hero h2{margin:0;font-size:17px;font-weight:700;}
  .hero p{margin:6px 0 0;color:var(--text-secondary);font-size:13px;}
  .hero .arrow{color:var(--text-muted);font-size:18px;}

  h3.sect{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--text-muted);margin:0 0 10px;}
  .weeks{display:grid;gap:8px;}
  .weeks a{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface-1);border:1px solid var(--border);border-radius:10px;
    padding:11px 14px;text-decoration:none;color:var(--text-primary);font-size:14px;font-weight:600;}
  .weeks a:hover{border-color:var(--text-muted);}
  .weeks a .go{color:var(--text-muted);font-weight:500;font-size:12px;}
  .empty{color:var(--text-muted);font-size:13px;padding:16px 2px;}
  .placeholder{color:var(--text-muted);font-size:12px;padding:2px;margin-top:4px;}

  footer.f{margin-top:32px;color:var(--text-muted);font-size:11px;text-align:center;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">DadsFFL<span class="sub">Fantasy Football League</span></div>
    <button class="theme-toggle" id="themeBtn" type="button">Theme</button>
  </header>

  <a class="hero" href="live.html" id="liveHero">
    <div class="row">
      <div>
        <h2><span class="live-dot"></span>Live Scoring</h2>
        <p id="liveSub">Every player's fantasy points, computed live from the ESPN feed.</p>
      </div>
      <div class="arrow">&rarr;</div>
    </div>
  </a>

  <a class="hero" href="https://claude.ai/code/artifact/4b67c420-a2a5-42f3-bcc3-95cc91685fc2" target="_blank" rel="noopener">
    <div class="row">
      <div>
        <h2>2026 Rosters</h2>
        <p>All 8 teams' draft rosters, searchable by player and position.</p>
      </div>
      <div class="arrow">&rarr;</div>
    </div>
  </a>

  <h3 class="sect">This Season</h3>
  <div class="weeks" id="weeks"><div class="empty">Loading…</div></div>

  <footer class="f" id="footer">Source: ESPN box scores · scored live via a Supabase Edge Function</footer>
</div>
<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://lpcremgkmgumumboqjux.supabase.co";
  const ANON_KEY = "sb_publishable_zOdIS--l6_TDNSlrOE_RhA_s3E54zsj";
  const REST_BASE = SUPABASE_URL + "/rest/v1";
  const REST_HEADERS = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY };

  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function getJSON(path){
    const res = await fetch(REST_BASE + path, { headers: REST_HEADERS });
    if (!res.ok) throw new Error("Supabase query failed (" + res.status + "): " + path);
    return res.json();
  }

  // ---- Theme toggle (same as live.html) --------------------------------------
  const themeBtn=document.getElementById('themeBtn'),themeOrder=['','light','dark'],
        themeLabels={'':'Theme: Auto','light':'Theme: Light','dark':'Theme: Dark'};
  let ti=0;
  function applyTheme(){document.documentElement.setAttribute('data-theme',themeOrder[ti]);themeBtn.textContent=themeLabels[themeOrder[ti]];}
  themeBtn.addEventListener('click',()=>{ti=(ti+1)%themeOrder.length;applyTheme();});
  applyTheme();

  // ---- Weeks list --------------------------------------------------------------
  // Scoped to just the current (most recent) season for now — once prior seasons
  // are migrated into Supabase, this is the natural place to add a "Past Seasons"
  // section below without disturbing this one.
  async function loadWeeks(){
    const box = document.getElementById('weeks');
    try {
      const weeks = await getJSON(
        "/weeks?select=id,season_id,season_type,week_number,label,title" +
        "&order=season_id.desc,season_type.desc,week_number.desc&limit=64"
      );
      if (!weeks.length) {
        box.innerHTML = '<div class="empty">Season hasn’t started yet — weekly links will appear here once Week 1 is scored.</div>';
        return;
      }
      const currentSeason = weeks[0].season_id;
      const thisSeason = weeks.filter(w => w.season_id === currentSeason)
        .sort((a,b) => (a.season_type - b.season_type) || (a.week_number - b.week_number));
      box.innerHTML = thisSeason.map(w =>
        `<a href="live.html?week=${esc(w.label)}"><span>${esc(w.title)}</span><span class="go">View &rarr;</span></a>`
      ).join('');
    } catch (e) {
      box.innerHTML = '<div class="empty">Could not load weeks right now (' + esc(e.message) + ').</div>';
    }
  }
  loadWeeks();
})();
</script>
</body>
</html>
